", "verified": false}, {"start": "06:45", "end": "06:46", "start_seconds": 405.7, "end_seconds": 406.7, "text": "已經看到耶", "source": "whisper", "verified": false}, {"start": "06:46", "end": "06:47", "start_seconds": 406.7, "end_seconds": 407.7, "text": "對", "source": "whisper", "verified": false}, {"start": "06:47", "end": "06:49", "start_seconds": 407.7, "end_seconds": 409.7, "text": "我先生就是我們眼前", "source": "whisper", "verified": false}, {"start": "06:49", "end": "06:51", "start_seconds": 409.7, "end_seconds": 411.7, "text": "一整箱", "source": "whisper", "verified": false}, {"start": "06:51", "end": "06:52", "start_seconds": 411.7, "end_seconds": 412.7, "text": "一整箱", "source": "whisper", "verified": false}, {"start": "06:52", "end": "06:53", "start_seconds": 412.7, "end_seconds": 413.7, "text": "還要找昆蟲王", "source": "whisper", "verified": false}, {"start": "06:53", "end": "06:54", "start_seconds": 413.7, "end_seconds": 414.7, "text": "大哥", "source": "whisper", "verified": false}, {"start": "06:54", "end": "06:56", "start_seconds": 414.7, "end_seconds": 416.7, "text": "你每天跟他們招戲下去", "source": "whisper", "verified": false}, {"start": "06:56", "end": "06:57", "start_seconds": 416.7, "end_seconds": 417.7, "text": "對啊", "source": "whisper", "verified": false}, {"start": "06:57", "end": "06:58", "start_seconds": 417.7, "end_seconds": 418.7, "text": "要為他們是不是", "source": "whisper", "verified": false}, {"start": "06:58", "end": "06:59", "start_seconds": 418.7, "end_seconds": 419.7, "text": "不是為他們", "source": "whisper", "verified": false}, {"start": "06:59", "end": "07:00", "start_seconds": 419.7, "end_seconds": 420.7, "text": "不是要整理", "source": "whisper", "verified": false}, {"start": "07:00", "end": "07:01", "start_seconds": 420.7, "end_seconds": 421.7, "text": "管理", "source": "whisper", "verified": false}, {"start": "07:01", "end": "07:02", "start_seconds": 421.7, "end_seconds": 422.7, "text": "管理他們", "source": "whisper", "verified": false}, {"start": "07:02", "end": "07:03", "s , "end_seconds": 755.22, "text": "很痛苦", "source": "whisper", "verified": false}, {"start": "12:35", "end": "12:36", "start_seconds": 755.22, "end_seconds": 756.62, "text": "明明就一定要想痛苦", "source": "whisper", "verified": false}, {"start": "12:36", "end": "12:37", "start_seconds": 756.62, "end_seconds": 757.22, "text": "你要在那邊", "source": "whisper", "verified": false}, {"start": "12:37", "end": "12:38", "start_seconds": 757.22, "end_seconds": 758.02, "text": "肺疑猜的", "source": "whisper", "verified": false}, {"start": "12:38", "end": "12:39", "start_seconds": 758.02, "end_seconds": 759.62, "text": "肥肉拍照", "source": "whisper", "verified": false}, {"start": "12:39", "end": "12:40", "start_seconds": 759.62, "end_seconds": 760.12, "text": "而且", "source": "whisper", "verified": false}, {"start": "12:40", "end": "12:41", "start_seconds": 760.12, "end_seconds": 761.12, "text": "都沒辦法好好逛", "source": "whisper", "verified": false}, {"start": "12:41", "end": "12:42", "start_seconds": 761.12, "end_seconds": 762.22, "text": "而且順同學", "source": "whisper", "verified": false}, {"start": "12:42", "end": "12:43", "start_seconds": 762.22, "end_seconds": 763.72, "text": "順同學 兩兩一組", "source": "whisper", "verified": false}, {"start": "12:43", "end": "12:44", "start_seconds": 763.72, "end_seconds": 764.72, "text": "他也有偷翻了", "source": "whisper", "verified": false}, {"start": "12:44", "end": "12:45", "start_seconds": 764.72, "end_seconds": 765.22, "text": "有嗎", "source": "whisper", "verified": false}, {"start": "12:45", "end": "12:46", "start_seconds": 765.22, "end_seconds": 766.72, "text": "沒有 剛剛沒有說兩兩一組", "source": "whisper", "verified": false}, {"start": "12:46", "end": "12:47", "start_seconds": 766.72, "end_seconds": 767.02, "text": "來 給他一組", "source": "whisper", "verified": false}, {"start": "12:47", "end": "12:48", "start_seconds": 767.02, "end_seconds": 768.22, "text": "來 給他偷偷幹嘛", "source": "whisper", "verified": false}, {"start": "12:48", "end": "12:48", "start_seconds": 768.22, "end_seconds" d": "02:09", "start_seconds": 126.95, "end_seconds": 129.83, "text": "我們那裡是鑽大灣平第四年", "source": "whisper", "verified": false}, {"start": "02:09", "end": "02:12", "start_seconds": 129.83, "end_seconds": 132.99, "text": "我們那裡才幾乎八乎我而已", "source": "whisper", "verified": false}, {"start": "02:12", "end": "02:14", "start_seconds": 132.99, "end_seconds": 134.63, "text": "三乎賓過來", "source": "whisper", "verified": false}, {"start": "02:14", "end": "02:15", "start_seconds": 134.63, "end_seconds": 135.83, "text": "來看一看就", "source": "whisper", "verified": false}, {"start": "02:15", "end": "02:18", "start_seconds": 135.83, "end_seconds": 138.03, "text": "他有在我們來這裡看", "source": "whisper", "verified": false}, {"start": "02:18", "end": "02:19", "start_seconds": 138.03, "end_seconds": 139.87, "text": "阿嬤要來就是", "source": "whisper", "verified": false}, {"start": "02:19", "end": "02:21", "start_seconds": 139.87, "end_seconds": 141.19, "text": "五個人八溫弟", "source": "whisper", "verified": false}, {"start": "02:21", "end": "02:23", "start_seconds": 141.19, "end_seconds": 143.19, "text": "六個人一家弟", "source": "whisper", "verified": false}, {"start": "02:23", "end": "02:24", "start_seconds": 143.19, "end_seconds": 144.55, "text": "阿塌移民青春", "source": "whisper", "verified": false}, {"start": "02:24", "end": "02:26", "start_seconds": 144.55, "end_seconds": 146.07, "text": "你抽你的房子再拿", "source": "whisper", "verified": false}, {"start": "02:26", "end": "02:26", "start_seconds": 146.07, "end_seconds": 146.79, "text": "他的一號", "source": "whisper", "verified": false}, {"start": "02:26", "end": "02:28", "start_seconds": 146.79, "end_seconds": 148.39, "text": "王王子是抽山", "source": "whisper", "verified": false}, {"start": "02:28", "end": "02:29", "start_seconds": 148.39, "end_seconds": 149.59, "text": "有弟也是抽山", "source": "whisper", "verified": false}, {"start": "02:29", "end": "02:31", "start_seconds": 149.59, "end_seconds": 151.51, "text": "對啊 都自己種流寧暗", "source": "whisper", "verified": false}, {"start": "02:31", "end": "02:34", "start_seconds": 151.51, "end_seconds": 154.03, "text": "種的才有掌風", "source": "whisper", "verified": false}, {"start": "02:34", "end": "02:34", "start_seconds": 154.03, "end_seconds": 154.51, "text": "有沒有", "source": "whisper", "verified": false}, {"start": "02:34", "end": "02:37", "start_seconds": 154.51, "end_seconds": 157.23, "text": "沒有 那個都都是殺了", "source": "whisper", "verified": false}, {"start": "02:37", "end": "02:38", "start_seconds": 157.23, "end_seconds": 158.67, "text": "六十多年過去", "source": "whisper", "verified": false}, {"start": "02:38", "end": "02:40", "start_seconds": 158.67, "end_seconds": 160.59, "text": "他們對早年的生活記憶", "source": "whisper", "verified": false}, {"start": "02:40", "end": "02:41", "start_seconds": 160.59, "end_seconds": 161.79, "text": "已經模糊", "source": "whisper", "verified": false}, {"start": "02:41", "end": "02:43", "start_seconds": 161.79, "end_seconds": 163.39, "text": "現在圍繞村莊", "source": "whisper", "verified": false}, {"start": "02:43", "end": "02:46", "start_seconds": 163.39, "end_seconds": 166.31, "text": "海偶能遮印的西蘇蘇林", "source": "whisper", "verified": false}, {"start": "02:46", "end": "02:47", "start_seconds": 166.31, "end_seconds": 167.59, "text": "全都是移民", "source": "whisper", "verified": false}, {"start": "02:47", "end": "02:49", "start_seconds": 167.59, "end_seconds": 169.35, "text": "親手主起的家園", "source": "whisper", "verified": false}, {"start": "02:49", "end": "02:51", "start_seconds": 169.35, "end_seconds": 171.35, "text": "這個也是跟我們一起來的", "source": "whisper", "verified": false}, {"start": "02:51", "end": "02:53", "start_seconds": 171.35, "end_seconds": 173.23, "text": "會有蓋這個給他看", "source": "whisper", "verified": false}, {"start": "02:53", "end": "02:55", "start_seconds": 173.23, "end_seconds": 175.43, "text": "你才有九千塊", "source": "whisper", "verified": false}, {"start": "02:55", "end": "02:56", "start_seconds": 175.43, "end_seconds": 176.79, "text": "還要蓋到這樣一點", "source": "whisper", "verified": false}, {"start": "02:56", "end": "02:59", "start_seconds": 176.79, "end_seconds": 179.79, "text": "一定最起碼要蓋這個兩枕", "source": "whisper", "verified": false}, {"start": "02:59", "end": "03:01", "start_seconds": 179.79, "end_seconds": 181.59, "text": "半千補助款不足", "source": "whisper", "verified": false}, {"start": "03:01", "end": "03:04", "start_seconds": 181.59, "end_seconds": 184.07, "text": "蓋房子的錢從哪裡來", "source": "whisper", "verified": false}, {"start": "03:04", "end": "03:06", "start_seconds": 184.07, "end_seconds": 186.47, "text": "凡事都得自己想辦法", "source": "whisper", "verified": false}, {"start": "03:06", "end": "03:09", "start_seconds": 186.47, "end_seconds": 189.27, "text": "哪有公平就要蓋那個房子", "source": "whisper", "verified": false}, {"start": "03:09", "end": "03:10", "start_seconds": 189.27, "end_seconds": 190.27, "text": "阿嬤阿森我會", "source": "whisper", "verified": false}, {"start": "03:10", "end": "03:11", "start_seconds": 190.27, "end_seconds": 191.59, "text": "都沒有都靠自己的", "source": "whisper", "verified": false}, {"start": "03:11", "end": "03:13", "start_seconds": 191.59, "end_seconds": 193.59, "text": "才弄出這個", "source": "whisper", "verified": false}, {"start": "03:13", "end": "03:15", "start_seconds": 193.59, "end_seconds": 195.99, "text": "那個公公山都還被人抖殺", "source": "whisper", "verified": false}, {"start": "03:15", "end": "03:20", "start_seconds": 195.99, "end_seconds": 200.5, "text": "阿嬤不起來", "source": "whisper", "verified": false}, {"start": "03:20", "end": "03:23", "start_seconds": 200.5, "end_seconds": 203.75, "text": "會有二十多", "source": "whisper", "verified": false}, {"start": "03:23", "end": "03:26", "start_seconds": 203.75, "end_seconds": 206.35, "text": "加上海邊的田地延分高", "source": "whisper", "verified": false}, {"start": "03:26", "end": "03:28", "start_seconds": 206.35, "end_seconds": 208.95, "text": "中不出高經濟價值的作物", "source": "whisper", "verified": false}, {"start": "03:28", "end": "03:30", "start_seconds": 208.95, "end_seconds": 210.15, "text": "收入有限", "source": "whisper", "verified": false}, {"start": "03:30", "end": "03:33", "start_seconds": 210.15, "end_seconds": 213.55, "text": "維持生計都有困難", "source": "whisper", "verified": false}, {"start": "03:33", "end": "03:36", "start_seconds": 213.55, "end_seconds": 216.55, "text": "半千當時阿嬤的年紀還很小", "source": "whisper", "verified": false}, {"start": "03:36", "end": "03:37", "start_seconds": 216.55, "end_seconds": 217.55, "text": "千順的歷史", "source": "whisper", "verified": false}, {"start": "03:37", "end": "03:40", "start_seconds": 217.55, "end_seconds": 220.55, "text": "我們只能從更年長的軍民描述", "source": "whisper", "verified": false}, {"start": "03:40", "end": "03:42", "start_seconds": 220.55, "end_seconds": 222.75, "text": "來拼湊全貿", "source": "whisper", "verified": false}, {"start": "03:42", "end": "03:46", "start_seconds": 222.75, "end_seconds": 226.75, "text": "半千那時候我們就是當年了", "source": "whisper", "verified": false}, {"start": "03:46", "end": "03:48", "start_seconds": 226.75, "end_seconds": 228.35, "text": "報實提示", "source": "whisper", "verified": false}, {"start": "03:48", "end": "03:50", "start_seconds": 228.35, "end_seconds": 230.35, "text": "年過八十的湯阿公", "source": "whisper", "verified": false}, {"start": "03:50", "end": "03:52", "start_seconds": 230.35, "end_seconds": 232.75, "text": "在一九五八年千順當時", "source": "whisper", "verified": false}, {"start": "03:52", "end": "03:54", "start_seconds": 232.75, "end_seconds": 234.95, "text": "沒有獲得土地補償", "source": "whisper", "verified": false}, {"start": "03:54", "end": "03:56", "start_seconds": 234.95, "end_seconds": 236.55, "text": "加上老家的田地", "source": "whisper", "verified": false}, {"start": "03:56", "end": "03:58", "start_seconds": 236.55, "end_seconds": 238.35, "text": "在水庫蓄水之後", "source": "whisper", "verified": false}, {"start": "03:58", "end": "04:00", "start_seconds": 238.35, "end_seconds": 240.95, "text": "連同家屋已並淹沒", "source": "whisper", "verified": false}, {"start": "04:00", "end": "04:03", "start_seconds": 240.95, "end_seconds": 243.55, "text": "在生活無意危機的情況之下", "source": "whisper", "verified": false}, {"start": "04:03", "end": "04:04", "start_seconds": 243.55, "end_seconds": 244.75, "text": "一九六九年", "source": "whisper", "verified": false}, {"start": "04:04", "end": "04:06", "start_seconds": 244.75, "end_seconds": 246.15, "text": "他們丟家半千", "source": "whisper", "verified": false}, {"start": "04:06", "end": "04:09", "start_seconds": 246.15, "end_seconds": 249.15, "text": "到草塌以民心村", "source": "whisper", "verified": false}, {"start": "04:09", "end": "04:11", "start_seconds": 249.15, "end_seconds": 251.15, "text": "我十六年生的時候", "source": "whisper", "verified": false}, {"start": "04:11", "end": "04:13", "start_seconds": 251.35, "end_seconds": 253.35, "text": "我是這開會", "source": "whisper", "verified": false}, {"start": "04:13", "end": "04:13", "start_seconds": 253.35, "end_seconds": 253.95, "text": "登記起來", "source": "whisper", "verified": false}, {"start": "04:13", "end": "04:17", "start_seconds": 253.95, "end_seconds": 257.35, "text": "他說民國四十六年", "source": "whisper", "verified": false}, {"start": "04:17", "end": "04:18", "start_seconds": 257.35, "end_seconds": 258.35, "text": "六月三十號", "source": "whisper", "verified": false}, {"start": "04:18", "end": "04:20", "start_seconds": 258.35, "end_seconds": 260.35, "text": "他們就開會", "source": "whisper", "verified": false}, {"start": "04:20", "end": "04:22", "start_seconds": 260.35, "end_seconds": 262.75, "text": "他就有所謂", "source": "whisper", "verified": false}, {"start": "04:22", "end": "04:23", "start_seconds": 262.75, "end_seconds": 263.95, "text": "我們這個企業", "source": "whisper", "verified": false}, {"start": "04:23", "end": "04:25", "start_seconds": 263.95, "end_seconds": 265.15, "text": "於是在開工", "source": "whisper", "verified": false}, {"start": "04:25", "end": "04:27", "start_seconds": 265.15, "end_seconds": 267.55, "text": "國立六月三十號", "source": "whisper", "verified": false}, {"start": "04:27", "end": "04:29", "start_seconds": 267.55, "end_seconds": 269.15, "text": "沒有開復可樂", "source": "whisper", "verified": false}, {"start": "04:29", "end": "04:31", "start_seconds": 269.15, "end_seconds": 271.95, "text": "你就沒有建議配股地", "source": "whisper", "verified": false}, {"start": "04:31", "end": "04:33", "start_seconds": 271.95, "end_seconds": 273.35, "text": "在湯家一名二代", "source": "whisper", "verified": false}, {"start": "04:33", "end": "04:35", "start_seconds": 273.35, "end_seconds": 275.15, "text": "湯森林的代理下", "source": "whisper", "verified": false}, {"start": "04:35", "end": "04:38", "start_seconds": 275.15, "end_seconds": 278.35, "text": "我們重回他在十門水庫的老家", "source": "whisper", "verified": false}, {"start": "04:38", "end": "04:40", "start_seconds": 278.35, "end_seconds": 280.95, "text": "一趟大約五十公里的路程", "source": "whisper", "verified": false}, {"start": "04:40", "end": "04:42", "start_seconds": 280.95, "end_seconds": 282.15, "text": "不長不短", "source": "whisper", "verified": false}, {"start": "04:42", "end": "04:44", "start_seconds": 282.15, "end_seconds": 284.15, "text": "卻切割了兩個世代", "source": "whisper", "verified": false}, {"start": "04:44", "end": "04:47", "start_seconds": 284.15, "end_seconds": 287.15, "text": "對故鄉的記憶", "source": "whisper", "verified": false}, {"start": "04:47", "end": "04:48", "start_seconds": 287.15, "end_seconds": 288.35, "text": "這些年來", "source": "whisper", "verified": false}, {"start": "04:48", "end": "04:50", "start_seconds": 288.35, "end_seconds": 290.35, "text": "在十門水庫的庫水旗", "source": "whisper", "verified": false}, {"start": "04:50", "end": "04:52", "start_seconds": 290.35, "end_seconds": 292.95, "text": "湯森林都會帶著村中長輩", "source": "whisper", "verified": false}, {"start": "04:52", "end": "04:53", "start_seconds": 292.95, "end_seconds": 293.95, "text": "重新踏上", "source": "whisper", "verified": false}, {"start": "04:53", "end": "04:55", "start_seconds": 293.95, "end_seconds": 295.15, "text": "被外界稱為", "source": "whisper", "verified": false}, {"start": "04:55", "end": "04:58", "start_seconds": 295.15, "end_seconds": 298.15, "text": "夢幻大草原的新甘平", "source": "whisper", "verified": false}, {"start": "04:58", "end": "04:59", "start_seconds": 298.15, "end_seconds": 299.65, "text": "也是他們的老家", "source": "whisper", "verified": false}, {"start": "04:59", "end": "05:02", "start_seconds": 299.65, "end_seconds": 302.15, "text": "日夜思念的故土", "source": "whisper", "verified": false}, {"start": "05:02", "end": "05:02", "start_seconds": 302.15, "end_seconds": 302.95, "text": "像今天水位", "source": "whisper", "verified": false}, {"start": "05:02", "end": "05:04", "start_seconds": 302.95, "end_seconds": 304.55, "text": "水庫水位兩百四十一名", "source": "whisper", "verified": false}, {"start": "05:04", "end": "05:05", "start_seconds": 304.55, "end_seconds": 305.55, "text": "就看不到", "source": "whisper", "verified": false}, {"start": "05:05", "end": "05:07", "start_seconds": 305.55, "end_seconds": 307.75, "text": "要到兩百三四名才辦法", "source": "whisper", "verified": false}, {"start": "05:07", "end": "05:09", "start_seconds": 307.75, "end_seconds": 309.15, "text": "兩百三十二米的時候", "source": "whisper", "verified": false}, {"start": "05:09", "end": "05:10", "start_seconds": 309.15, "end_seconds": 310.55, "text": "當然前面走半步", "source": "whisper", "verified": false}, {"start": "05:10", "end": "05:12", "start_seconds": 310.55, "end_seconds": 312.35, "text": "它左邊的地是比較高", "source": "whisper", "verified": false}, {"start": "05:12", "end": "05:15", "start_seconds": 312.35, "end_seconds": 315.15, "text": "就是越地越地越地", "source": "whisper", "verified": false}, {"start": "05:15", "end": "05:16", "start_seconds": 315.15, "end_seconds": 316.55, "text": "到最後那個更低", "source": "whisper", "verified": false}, {"start": "05:16", "end": "05:18", "start_seconds": 316.55, "end_seconds": 318.95, "text": "到兩百二十五名才看得到", "source": "whisper", "verified": false}, {"start": "05:18", "end": "05:20", "start_seconds": 318.95, "end_seconds": 320.55, "text": "以前那個整台", "source": "whisper", "verified": false}, {"start": "05:20", "end": "05:21", "start_seconds": 320.55, "end_seconds": 321.95, "text": "就是一個新甘平", "source": "whisper", "verified": false}, {"start": "05:21", "end": "05:22", "start_seconds": 321.95, "end_seconds": 322.75, "text": "一個台階地形", "source": "whisper", "verified": false}, {"start": "05:22", "end": "05:24", "start_seconds": 322.75, "end_seconds": 324.55, "text": "然後房子都靠在", "source": "whisper", "verified": false}, {"start": "05:24", "end": "05:26", "start_seconds": 324.55, "end_seconds": 326.95, "text": "蓋的那個靠近三遙下面", "source": "whisper", "verified": false}, {"start": "05:26", "end": "05:28", "start_seconds": 326.95, "end_seconds": 328.95, "text": "那前面就是一些農地", "source": "whisper", "verified": false}, {"start": "05:28", "end": "05:30", "start_seconds": 328.95, "end_seconds": 330.95, "text": "後面可能還會一些茶園的主園", "source": "whisper", "verified": false}, {"start": "05:32", "end": "05:34", "start_seconds": 332.95, "end_seconds": 334.15, "text": "1964年", "source": "whisper", "verified": false}, {"start": "05:34", "end": "05:35", "start_seconds": 334.15, "end_seconds": 335.95, "text": "十門水庫完工之後", "source": "whisper", "verified": false}, {"start": "05:35", "end": "05:37", "start_seconds": 335.95, "end_seconds": 337.55, "text": "上游的積水區範圍", "source": "whisper", "verified": false}, {"start": "05:37", "end": "05:40", "start_seconds": 337.55, "end_seconds": 340.55, "text": "高達一千零二十四公斤", "source": "whisper", "verified": false}, {"start": "05:40", "end": "05:42", "start_seconds": 340.55, "end_seconds": 342.35, "text": "所有標高兩百五十公尺", "source": "whisper", "verified": false}, {"start": "05:42", "end": "05:43", "start_seconds": 342.35, "end_seconds": 343.55, "text": "以下的區域", "source": "whisper", "verified": false}, {"start": "05:43", "end": "05:45", "start_seconds": 343.55, "end_seconds": 345.95, "text": "包含新舊甘平", "source": "whisper", "verified": false}, {"start": "05:45", "end": "05:46", "start_seconds": 345.95, "end_seconds": 346.95, "text": "大西平", "source": "whisper", "verified": false}, {"start": "05:46", "end": "05:48", "start_seconds": 346.95, "end_seconds": 348.35, "text": "阿姆平等等", "source": "whisper", "verified": false}, {"start": "05:48", "end": "05:50", "start_seconds": 348.35, "end_seconds": 350.35, "text": "都成為水下世界", "source": "whisper", "verified": false}, {"start": "05:50", "end": "05:54", "start_seconds": 350.35, "end_seconds": 354.15, "text": "總計影響兩千八百七十人", "source": "whisper", "verified": false}, {"start": "05:54", "end": "05:56", "start_seconds": 354.15, "end_seconds": 356.95, "text": "根據十門水庫建設置的記錄", "source": "whisper", "verified": false}, {"start": "05:56", "end": "05:58", "start_seconds": 356.95, "end_seconds": 358.35, "text": "整個沿墨區", "source": "whisper", "verified": false}, {"start": "05:58", "end": "06:00", "start_seconds": 358.35, "end_seconds": 360.75, "text": "共有四百一十六戶", "source": "whisper", "verified": false}, {"start": "06:00", "end": "06:03", "start_seconds": 360.75, "end_seconds": 363.15, "text": "但是扣除掉其他因素", "source": "whisper", "verified": false}, {"start": "06:03", "end": "06:05", "start_seconds": 363.15, "end_seconds": 365.55, "text": "最後只剩下兩百七十八戶", "source": "whisper", "verified": false}, {"start": "06:05", "end": "06:06", "start_seconds": 365.55, "end_seconds": 366.55, "text": "分成五批", "source": "whisper", "verified": false}, {"start": "06:06", "end": "06:08", "start_seconds": 366.55, "end_seconds": 368.55, "text": "先後移往草塌新村", "source": "whisper", "verified": false}, {"start": "06:08", "end": "06:10", "start_seconds": 368.55, "end_seconds": 370.95, "text": "樹林和下樹林新村", "source": "whisper", "verified": false}, {"start": "06:10", "end": "06:12", "start_seconds": 370.95, "end_seconds": 372.15, "text": "大坦新村", "source": "whisper", "verified": false}, {"start": "06:12", "end": "06:14", "start_seconds": 372.15, "end_seconds": 374.15, "text": "以及大輪圍", "source": "whisper", "verified": false}, {"start": "06:14", "end": "06:15", "start_seconds": 374.15, "end_seconds": 375.55, "text": "大園鑽骨頭", "source": "whisper", "verified": false}, {"start": "06:15", "end": "06:16", "start_seconds": 375.55, "end_seconds": 376.75, "text": "取搓杆", "source": "whisper", "verified": false}, {"start": "06:16", "end": "06:18", "start_seconds": 376.75, "end_seconds": 378.55, "text": "還有八十二戶泰亞族", "source": "whisper", "verified": false}, {"start": "06:18", "end": "06:19", "start_seconds": 378.55, "end_seconds": 379.75, "text": "經過邪商", "source": "whisper", "verified": false}, {"start": "06:19", "end": "06:23", "start_seconds": 379.75, "end_seconds": 383.35, "text": "移往最靠近的大西中莊", "source": "whisper", "verified": false}, {"start": "06:23", "end": "06:26", "start_seconds": 383.35, "end_seconds": 386.35, "text": "有四種不同的房屋形態", "source": "whisper", "verified": false}, {"start": "06:26", "end": "06:27", "start_seconds": 386.35, "end_seconds": 387.35, "text": "然後他們所建設出來的", "source": "whisper", "verified": false}, {"start": "06:27", "end": "06:29", "start_seconds": 387.35, "end_seconds": 389.35, "text": "順著基本上包括醫療", "source": "whisper", "verified": false}, {"start": "06:29", "end": "06:31", "start_seconds": 389.35, "end_seconds": 391.15, "text": "緊張單位等等的", "source": "whisper", "verified": false}, {"start": "06:31", "end": "06:33", "start_seconds": 391.15, "end_seconds": 393.15, "text": "其實都有配置", "source": "whisper", "verified": false}, {"start": "06:33", "end": "06:39", "start_seconds": 393.15, "end_seconds": 399.97, "text": "那整個就是一個村落的一個形態", "source": "whisper", "verified": false}, {"start": "06:39", "end": "06:41", "start_seconds": 399.97, "end_seconds": 401.97, "text": "水庫號大工程的開發", "source": "whisper", "verified": false}, {"start": "06:41", "end": "06:44", "start_seconds": 401.97, "end_seconds": 404.17, "text": "大幅改變山串地貿", "source": "whisper", "verified": false}, {"start": "06:44", "end": "06:46", "start_seconds": 404.17, "end_seconds": 406.57, "text": "成全經濟和安全的背後", "source": "whisper", "verified": false}, {"start": "06:46", "end": "06:49", "start_seconds": 406.57, "end_seconds": 409.57, "text": "是來自居民離鄉的犧牲", "source": "whisper", "verified": false}, {"start": "06:49", "end": "06:51", "start_seconds": 409.57, "end_seconds": 411.57, "text": "在桃園地區的部分", "source": "whisper", "verified": false}, {"start": "06:51", "end": "06:53", "start_seconds": 411.57, "end_seconds": 413.57, "text": "因為它是一個所謂太地", "source": "whisper", "verified": false}, {"start": "06:53", "end": "06:55", "start_seconds": 413.57, "end_seconds": 415.17, "text": "農民他們在跟蹤的時候", "source": "whisper", "verified": false}, {"start": "06:55", "end": "06:56", "start_seconds": 415.17, "end_seconds": 416.77, "text": "其實是很缺水的", "source": "whisper", "verified": false}, {"start": "06:56", "end": "06:58", "start_seconds": 416.77, "end_seconds": 418.77, "text": "其實真正的主要的推理", "source": "whisper", "verified": false}, {"start": "06:58", "end": "07:00", "start_seconds": 418.77, "end_seconds": 420.37, "text": "就是在民國四、三年的時候", "source": "whisper", "verified": false}, {"start": "07:00", "end": "07:01", "start_seconds": 420.37, "end_seconds": 421.77, "text": "發生一個答案", "source": "whisper", "verified": false}, {"start": "07:01", "end": "07:03", "start_seconds": 421.77, "end_seconds": 423.97, "text": "他們在就地方的冠名", "source": "whisper", "verified": false}, {"start": "07:04", "end": "07:07", "start_seconds": 424.97, "end_seconds": 427.97, "text": "新建之初", "source": "whisper", "verified": false}, {"start": "07:07", "end": "07:09", "start_seconds": 427.97, "end_seconds": 429.97, "text": "石門水庫成為東亞第一大霸", "source": "whisper", "verified": false}, {"start": "07:09", "end": "07:13", "start_seconds": 429.97, "end_seconds": 433.97, "text": "聚在啟用前一年面臨巨大考驗", "source": "whisper", "verified": false}, {"start": "07:13", "end": "07:15", "start_seconds": 433.97, "end_seconds": 435.97, "text": "1963年9月", "source": "whisper", "verified": false}, {"start": "07:15", "end": "07:17", "start_seconds": 435.97, "end_seconds": 437.97, "text": "長臺隔了禮來襲", "source": "whisper", "verified": false}, {"start": "07:17", "end": "07:19", "start_seconds": 437.97, "end_seconds": 439.97, "text": "石門水庫水位機身", "source": "whisper", "verified": false}, {"start": "07:19", "end": "07:21", "start_seconds": 439.97, "end_seconds": 441.97, "text": "啟動首次洩風", "source": "whisper", "verified": false}, {"start": "07:21", "end": "07:25", "start_seconds": 441.97, "end_seconds": 445.97, "text": "台風發生在9月11號", "source": "whisper", "verified": false}, {"start": "07:25", "end": "07:27", "start_seconds": 445.97, "end_seconds": 447.97, "text": "我們說石門水庫的9月11號", "source": "whisper", "verified": false}, {"start": "07:27", "end": "07:28", "start_seconds": 447.97, "end_seconds": 448.97, "text": "時間", "source": "whisper", "verified": false}, {"start": "07:28", "end": "07:30", "start_seconds": 448.97, "end_seconds": 450.97, "text": "那一次的話", "source": "whisper", "verified": false}, {"start": "07:30", "end": "07:34", "start_seconds": 450.97, "end_seconds": 454.97, "text": "它其實很快的21個小時之內", "source": "whisper", "verified": false}, {"start": "07:34", "end": "07:36", "start_seconds": 454.97, "end_seconds": 456.97, "text": "它就已經升了快三十公尺", "source": "whisper", "verified": false}, {"start": "07:36", "end": "07:37", "start_seconds": 456.97, "end_seconds": 457.97, "text": "畢竟到八點", "source": "whisper", "verified": false}, {"start": "07:37", "end": "07:38", "start_seconds": 457.97, "end_seconds": 458.97, "text": "當時水上來的時候", "source": "whisper", "verified": false}, {"start": "07:38", "end": "07:40", "start_seconds": 458.97, "end_seconds": 460.97, "text": "它就只能把門打開", "source": "whisper", "verified": false}, {"start": "07:40", "end": "07:43", "start_seconds": 460.97, "end_seconds": 463.97, "text": "因為它的水是持續在往上升的", "source": "whisper", "verified": false}, {"start": "07:43", "end": "07:45", "start_seconds": 463.97, "end_seconds": 465.97, "text": "主持巴就是不能讓它移頂", "source": "whisper", "verified": false}, {"start": "07:45", "end": "07:46", "start_seconds": 465.97, "end_seconds": 466.97, "text": "只要移頂這個主持巴", "source": "whisper", "verified": false}, {"start": "07:46", "end": "07:48", "start_seconds": 466.97, "end_seconds": 468.97, "text": "就會往會比較", "source": "whisper", "verified": false}, {"start": "07:48", "end": "07:50", "start_seconds": 468.97, "end_seconds": 470.97, "text": "石門水庫停過跪體危機", "source": "whisper", "verified": false}, {"start": "07:50", "end": "07:54", "start_seconds": 470.97, "end_seconds": 474.97, "text": "卻意外引發下游中裝新春的水換", "source": "whisper", "verified": false}, {"start": "07:54", "end": "07:56", "start_seconds": 474.97, "end_seconds": 476.97, "text": "這裡的軍民採鋼安頓", "source": "whisper", "verified": false}, {"start": "07:56", "end": "07:59", "start_seconds": 476.97, "end_seconds": 479.97, "text": "就給二度掀起到大坦新春", "source": "whisper", "verified": false}, {"start": "07:59", "end": "08:01", "start_seconds": 479.97, "end_seconds": 481.97, "text": "彷彿在石門水庫行艦之後", "source": "whisper", "verified": false}, {"start": "08:01", "end": "08:03", "start_seconds": 481.97, "end_seconds": 483.97, "text": "移民們就此開啟", "source": "whisper", "verified": false}, {"start": "08:03", "end": "08:06", "start_seconds": 483.97, "end_seconds": 486.97, "text": "世代流浪的所謂", "source": "whisper", "verified": false}, {"start": "08:06", "end": "08:11", "start_seconds": 486.97, "end_seconds": 491.02, "text": "現在那個還在開發", "source": "whisper", "verified": false}, {"start": "08:11", "end": "08:13", "start_seconds": 491.02, "end_seconds": 493.02, "text": "那個天都在西邊", "source": "whisper", "verified": false}, {"start": "08:13", "end": "08:16", "start_seconds": 493.02, "end_seconds": 496.02, "text": "我記得老人家到一個石頭", "source": "whisper", "verified": false}, {"start": "08:16", "end": "08:18", "start_seconds": 496.02, "end_seconds": 498.02, "text": "一個一個板子", "source": "whisper", "verified": false}, {"start": "08:18", "end": "08:20", "start_seconds": 498.02, "end_seconds": 500.02, "text": "做那個天梗", "source": "whisper", "verified": false}, {"start": "08:20", "end": "08:22", "start_seconds": 500.02, "end_seconds": 502.02, "text": "還沒中到道子", "source": "whisper", "verified": false}, {"start": "08:22", "end": "08:23", "start_seconds": 502.02, "end_seconds": 503.02, "text": "台風就來了", "source": "whisper", "verified": false}, {"start": "08:23", "end": "08:24", "start_seconds": 503.02, "end_seconds": 504.02, "text": "就沒有了", "source": "whisper", "verified": false}, {"start": "08:24", "end": "08:26", "start_seconds": 504.02, "end_seconds": 506.02, "text": "我記得我爸爸", "source": "whisper", "verified": false}, {"start": "08:26", "end": "08:29", "start_seconds": 506.02, "end_seconds": 509.02, "text": "把我小朋友", "source": "whisper", "verified": false}, {"start": "08:29", "end": "08:32", "start_seconds": 509.02, "end_seconds": 512.02, "text": "還有過一個小河", "source": "whisper", "verified": false}, {"start": "08:32", "end": "08:33", "start_seconds": 512.02, "end_seconds": 513.02, "text": "小河也沒有", "source": "whisper", "verified": false}, {"start": "08:33", "end": "08:34", "start_seconds": 513.02, "end_seconds": 514.02, "text": "我把我拉來", "source": "whisper", "verified": false}, {"start": "08:34", "end": "08:36", "start_seconds": 514.02, "end_seconds": 516.02, "text": "別著的我往往上爬", "source": "whisper", "verified": false}, {"start": "08:36", "end": "08:38", "start_seconds": 516.02, "end_seconds": 518.02, "text": "那他們躲在那邊下去看", "source": "whisper", "verified": false}, {"start": "08:38", "end": "08:39", "start_seconds": 518.02, "end_seconds": 519.02, "text": "就看到他們", "source": "whisper", "verified": false}, {"start": "08:39", "end": "08:41", "start_seconds": 519.02, "end_seconds": 521.02, "text": "家裡幾乎都進到一半的", "source": "whisper", "verified": false}, {"start": "08:41", "end": "08:42", "start_seconds": 521.02, "end_seconds": 522.02, "text": "就是石頭餐殘", "source": "whisper", "verified": false}, {"start": "08:42", "end": "08:43", "start_seconds": 522.02, "end_seconds": 523.02, "text": "你殺", "source": "whisper", "verified": false}, {"start": "08:43", "end": "08:45", "start_seconds": 523.02, "end_seconds": 525.02, "text": "激烈的這麼多事以後", "source": "whisper", "verified": false}, {"start": "08:45", "end": "08:47", "start_seconds": 525.02, "end_seconds": 527.02, "text": "就像這服又安排說", "source": "whisper", "verified": false}, {"start": "08:47", "end": "08:48", "start_seconds": 527.02, "end_seconds": 528.02, "text": "怎麼是", "source": "whisper", "verified": false}, {"start": "08:48", "end": "08:50", "start_seconds": 528.02, "end_seconds": 530.02, "text": "為安排去選到冠嬰", "source": "whisper", "verified": false}, {"start": "08:50", "end": "08:52", "start_seconds": 530.02, "end_seconds": 532.02, "text": "蘇秀軍", "source": "whisper", "verified": false}, {"start": "08:52", "end": "08:53", "start_seconds": 532.02, "end_seconds": 533.02, "text": "漢表哥王振德", "source": "whisper", "verified": false}, {"start": "08:53", "end": "08:56", "start_seconds": 533.02, "end_seconds": 536.02, "text": "去泰亞族卡拉射的後裔", "source": "whisper", "verified": false}, {"start": "08:56", "end": "08:58", "start_seconds": 536.02, "end_seconds": 538.02, "text": "因為石門水庫的新艦", "source": "whisper", "verified": false}, {"start": "08:58", "end": "09:00", "start_seconds": 538.02, "end_seconds": 540.02, "text": "含風災影響", "source": "whisper", "verified": false}, {"start": "09:00", "end": "09:02", "start_seconds": 540.02, "end_seconds": 542.02, "text": "他們印象中的童年", "source": "whisper", "verified": false}, {"start": "09:02", "end": "09:04", "start_seconds": 542.02, "end_seconds": 544.02, "text": "總是在老家夫星鄉", "source": "whisper", "verified": false}, {"start": "09:04", "end": "09:05", "start_seconds": 544.02, "end_seconds": 545.02, "text": "和大坦青春", "source": "whisper", "verified": false}, {"start": "09:05", "end": "09:07", "start_seconds": 545.02, "end_seconds": 547.02, "text": "反覆前一", "source": "whisper", "verified": false}, {"start": "09:07", "end": "09:09", "start_seconds": 547.02, "end_seconds": 549.02, "text": "那邊沒辦法生活", "source": "whisper", "verified": false}, {"start": "09:09", "end": "09:12", "start_seconds": 549.02, "end_seconds": 552.02, "text": "什麼都沒辦法種植", "source": "whisper", "verified": false}, {"start": "09:12", "end": "09:13", "start_seconds": 552.02, "end_seconds": 553.02, "text": "我讀書就這樣", "source": "whisper", "verified": false}, {"start": "09:13", "end": "09:14", "start_seconds": 553.02, "end_seconds": 554.02, "text": "一年幾", "source": "whisper", "verified": false}, {"start": "09:14", "end": "09:15", "start_seconds": 554.02, "end_seconds": 555.02, "text": "二年幾", "source": "whisper", "verified": false}, {"start": "09:15", "end": "09:16", "start_seconds": 555.02, "end_seconds": 556.02, "text": "三年幾", "source": "whisper", "verified": false}, {"start": "09:16", "end": "09:18", "start_seconds": 556.02, "end_seconds": 558.02, "text": "是到最後生這邊", "source": "whisper", "verified": false}, {"start": "09:18", "end": "09:22", "start_seconds": 558.02, "end_seconds": 562.03, "text": "地鼠大坦電廠", "source": "whisper", "verified": false}, {"start": "09:22", "end": "09:25", "start_seconds": 562.03, "end_seconds": 565.03, "text": "含中有天然氣三階站的土地", "source": "whisper", "verified": false}, {"start": "09:25", "end": "09:27", "start_seconds": 565.03, "end_seconds": 567.03, "text": "設置了鐵門族島", "source": "whisper", "verified": false}, {"start": "09:27", "end": "09:29", "start_seconds": 567.03, "end_seconds": 569.03, "text": "這裡是蘇秀軍", "source": "whisper", "verified": false}, {"start": "09:29", "end": "09:31", "start_seconds": 569.03, "end_seconds": 571.03, "text": "大坦青春的路口", "source": "whisper", "verified": false}, {"start": "09:31", "end": "09:32", "start_seconds": 571.03, "end_seconds": 572.03, "text": "十多年來", "source": "whisper", "verified": false}, {"start": "09:32", "end": "09:34", "start_seconds": 572.03, "end_seconds": 574.03, "text": "互相早已改變了", "source": "whisper", "verified": false}, {"start": "09:34", "end": "09:35", "start_seconds": 574.03, "end_seconds": 575.03, "text": "它原酒的樣貌", "source": "whisper", "verified": false}, {"start": "09:35", "end": "09:37", "start_seconds": 575.03, "end_seconds": 577.03, "text": "千疑的命運", "source": "whisper", "verified": false}, {"start": "09:37", "end": "09:38", "start_seconds": 577.03, "end_seconds": 578.03, "text": "尚未告終", "source": "whisper", "verified": false}, {"start": "09:38", "end": "09:39", "start_seconds": 578.03, "end_seconds": 579.03, "text": "1970年代", "source": "whisper", "verified": false}, {"start": "09:39", "end": "09:42", "start_seconds": 579.03, "end_seconds": 582.03, "text": "桃園冰海開發工業區", "source": "whisper", "verified": false}, {"start": "09:43", "end": "09:46", "start_seconds": 583.03, "end_seconds": 586.54, "text": "由於這家化工廠過去", "source": "whisper", "verified": false}, {"start": "09:46", "end": "09:48", "start_seconds": 586.54, "end_seconds": 588.54, "text": "曾排放寒高量", "source": "whisper", "verified": false}, {"start": "09:48", "end": "09:49", "start_seconds": 588.54, "end_seconds": 589.54, "text": "各廢水", "source": "whisper", "verified": false}, {"start": "09:49", "end": "09:50", "start_seconds": 589.54, "end_seconds": 590.54, "text": "嚴重悟然了", "source": "whisper", "verified": false}, {"start": "09:50", "end": "09:51", "start_seconds": 590.54, "end_seconds": 591.54, "text": "附近的濃田", "source": "whisper", "verified": false}, {"start": "09:51", "end": "09:53", "start_seconds": 591.54, "end_seconds": 593.54, "text": "和附近的居民", "source": "whisper", "verified": false}, {"start": "09:53", "end": "09:55", "start_seconds": 593.54, "end_seconds": 595.54, "text": "造成暴民成為哥哥民", "source": "whisper", "verified": false}, {"start": "09:55", "end": "09:57", "start_seconds": 595.54, "end_seconds": 597.54, "text": "居民離換痛痛病", "source": "whisper", "verified": false}, {"start": "09:57", "end": "09:59", "start_seconds": 597.54, "end_seconds": 599.54, "text": "我這一次高於爆炸", "source": "whisper", "verified": false}, {"start": "09:59", "end": "10:01", "start_seconds": 599.54, "end_seconds": 601.54, "text": "他過不爆炸", "source": "whisper", "verified": false}, {"start": "10:01", "end": "10:02", "start_seconds": 601.54, "end_seconds": 602.54, "text": "過不爆炸", "source": "whisper", "verified": false}, {"start": "10:02", "end": "10:04", "start_seconds": 602.54, "end_seconds": 604.54, "text": "我們在烏洛", "source": "whisper", "verified": false}, {"start": "10:04", "end": "10:06", "start_seconds": 604.54, "end_seconds": 606.54, "text": "裏面的窗戶都被震破", "source": "whisper", "verified": false}, {"start": "10:06", "end": "10:09", "start_seconds": 606.54, "end_seconds": 609.54, "text": "當時這群卡拉射後帶", "source": "whisper", "verified": false}, {"start": "10:09", "end": "10:10", "start_seconds": 609.54, "end_seconds": 610.54, "text": "雖然發起抗議", "source": "whisper", "verified": false}, {"start": "10:10", "end": "10:13", "start_seconds": 610.54, "end_seconds": 613.54, "text": "但鏡土卻無法復原", "source": "whisper", "verified": false}, {"start": "10:13", "end": "10:14", "start_seconds": 613.54, "end_seconds": 614.54, "text": "那時候還沒有隔污染的時候", "source": "whisper", "verified": false}, {"start": "10:14", "end": "10:16", "start_seconds": 614.54, "end_seconds": 616.54, "text": "我們大家都真的沒洗衣服", "source": "whisper", "verified": false}, {"start": "10:16", "end": "10:18", "start_seconds": 616.54, "end_seconds": 618.54, "text": "後來隔污染之後", "source": "whisper", "verified": false}, {"start": "10:18", "end": "10:20", "start_seconds": 618.54, "end_seconds": 620.54, "text": "水就漲了", "source": "whisper", "verified": false}, {"start": "10:20", "end": "10:24", "start_seconds": 620.54, "end_seconds": 624.54, "text": "真的要找一些自己的記憶", "source": "whisper", "verified": false}, {"start": "10:24", "end": "10:26", "start_seconds": 624.54, "end_seconds": 626.54, "text": "找不到了", "source": "whisper", "verified": false}, {"start": "10:26", "end": "10:28", "start_seconds": 626.54, "end_seconds": 628.54, "text": "1990年前後", "source": "whisper", "verified": false}, {"start": "10:28", "end": "10:30", "start_seconds": 628.54, "end_seconds": 630.54, "text": "居民三度搬遷到大西", "source": "whisper", "verified": false}, {"start": "10:30", "end": "10:31", "start_seconds": 630.54, "end_seconds": 631.54, "text": "平正一帶", "source": "whisper", "verified": false}, {"start": "10:31", "end": "10:33", "start_seconds": 631.54, "end_seconds": 633.54, "text": "各自繞腳", "source": "whisper", "verified": false}, {"start": "10:33", "end": "10:34", "start_seconds": 633.54, "end_seconds": 634.54, "text": "再難重拒", "source": "whisper", "verified": false}, {"start": "10:34", "end": "10:35", "start_seconds": 634.54, "end_seconds": 635.54, "text": "之後", "source": "whisper", "verified": false}, {"start": "10:35", "end": "10:37", "start_seconds": 635.54, "end_seconds": 637.54, "text": "為了設立工廠和大壇電廠", "source": "whisper", "verified": false}, {"start": "10:37", "end": "10:39", "start_seconds": 637.54, "end_seconds": 639.54, "text": "觀音延海的大批", "source": "whisper", "verified": false}, {"start": "10:39", "end": "10:40", "start_seconds": 639.54, "end_seconds": 640.54, "text": "移民新村土地", "source": "whisper", "verified": false}, {"start": "10:40", "end": "10:42", "start_seconds": 640.54, "end_seconds": 642.54, "text": "再一次被徵收", "source": "whisper", "verified": false}, {"start": "10:42", "end": "10:44", "start_seconds": 642.54, "end_seconds": 644.54, "text": "加香藥帽一系改變", "source": "whisper", "verified": false}, {"start": "10:44", "end": "10:46", "start_seconds": 644.54, "end_seconds": 646.54, "text": "再也毀不到過去", "source": "whisper", "verified": false}, {"start": "10:46", "end": "10:51", "start_seconds": 646.54, "end_seconds": 651.51, "text": "隔汁水塘的小路旁邊", "source": "whisper", "verified": false}, {"start": "10:51", "end": "10:53", "start_seconds": 651.51, "end_seconds": 653.51, "text": "一整排的鐵皮屋", "source": "whisper", "verified": false}, {"start": "10:53", "end": "10:54", "start_seconds": 653.51, "end_seconds": 654.51, "text": "隱身在大西", "source": "whisper", "verified": false}, {"start": "10:54", "end": "10:56", "start_seconds": 654.51, "end_seconds": 656.51, "text": "這個小社區的角落", "source": "whisper", "verified": false}, {"start": "10:56", "end": "10:57", "start_seconds": 656.51, "end_seconds": 657.51, "text": "這裏是部分", "source": "whisper", "verified": false}, {"start": "10:57", "end": "10:58", "start_seconds": 657.51, "end_seconds": 658.51, "text": "卡拉射居民", "source": "whisper", "verified": false}, {"start": "10:58", "end": "10:59", "start_seconds": 658.51, "end_seconds": 659.51, "text": "租地", "source": "whisper", "verified": false}, {"start": "10:59", "end": "11:00", "start_seconds": 659.51, "end_seconds": 660.51, "text": "搭建而成的聚會所", "source": "whisper", "verified": false}, {"start": "11:00", "end": "11:02", "start_seconds": 660.51, "end_seconds": 662.51, "text": "也是他們口中的", "source": "whisper", "verified": false}, {"start": "11:02", "end": "11:03", "start_seconds": 662.51, "end_seconds": 663.51, "text": "下部落", "source": "whisper", "verified": false}, {"start": "11:03", "end": "11:04", "start_seconds": 663.51, "end_seconds": 664.51, "text": "這是我們", "source": "whisper", "verified": false}, {"start": "11:04", "end": "11:05", "start_seconds": 664.51, "end_seconds": 665.51, "text": "唯一現在唯一", "source": "whisper", "verified": false}, {"start": "11:05", "end": "11:06", "start_seconds": 665.51, "end_seconds": 666.51, "text": "可以來聊天的地方", "source": "whisper", "verified": false}, {"start": "11:06", "end": "11:07", "start_seconds": 666.51, "end_seconds": 667.51, "text": "如果是說", "source": "whisper", "verified": false}, {"start": "11:07", "end": "11:08", "start_seconds": 667.51, "end_seconds": 668.51, "text": "故鄉的話", "source": "whisper", "verified": false}, {"start": "11:08", "end": "11:09", "start_seconds": 668.51, "end_seconds": 669.51, "text": "我當然是大臺新村", "source": "whisper", "verified": false}, {"start": "11:09", "end": "11:11", "start_seconds": 669.51, "end_seconds": 671.51, "text": "因為我的所有的記憶", "source": "whisper", "verified": false}, {"start": "11:11", "end": "11:12", "start_seconds": 671.51, "end_seconds": 672.51, "text": "都在那邊", "source": "whisper", "verified": false}, {"start": "11:12", "end": "11:13", "start_seconds": 672.51, "end_seconds": 673.51, "text": "雖然苦", "source": "whisper", "verified": false}, {"start": "11:13", "end": "11:15", "start_seconds": 673.51, "end_seconds": 675.51, "text": "可是大家都會互相綁綁", "source": "whisper", "verified": false}, {"start": "11:15", "end": "11:16", "start_seconds": 675.51, "end_seconds": 676.51, "text": "我們那種感覺", "source": "whisper", "verified": false}, {"start": "11:16", "end": "11:19", "start_seconds": 676.51, "end_seconds": 679.51, "text": "現在感覺不到了", "source": "whisper", "verified": false}, {"start": "11:19", "end": "11:20", "start_seconds": 679.51, "end_seconds": 680.51, "text": "移民新村人口", "source": "whisper", "verified": false}, {"start": "11:20", "end": "11:21", "start_seconds": 680.51, "end_seconds": 681.51, "text": "逐年減少", "source": "whisper", "verified": false}, {"start": "11:21", "end": "11:22", "start_seconds": 681.51, "end_seconds": 682.51, "text": "但人有居民", "source": "whisper", "verified": false}, {"start": "11:22", "end": "11:23", "start_seconds": 682.51, "end_seconds": 683.51, "text": "盼望留住這片", "source": "whisper", "verified": false}, {"start": "11:23", "end": "11:25", "start_seconds": 683.51, "end_seconds": 685.51, "text": "極富歷史意義的", "source": "whisper", "verified": false}, {"start": "11:25", "end": "11:27", "start_seconds": 685.51, "end_seconds": 687.51, "text": "人文地集", "source": "whisper", "verified": false}, {"start": "11:27", "end": "11:28", "start_seconds": 687.51, "end_seconds": 688.51, "text": "不管你去哪個移民新村", "source": "whisper", "verified": false}, {"start": "11:28", "end": "11:29", "start_seconds": 688.51, "end_seconds": 689.51, "text": "都會經過這個", "source": "whisper", "verified": false}, {"start": "11:29", "end": "11:31", "start_seconds": 689.51, "end_seconds": 691.51, "text": "成本這個台樓", "source": "whisper", "verified": false}, {"start": "11:31", "end": "11:33", "start_seconds": 691.51, "end_seconds": 693.51, "text": "1962年設置的", "source": "whisper", "verified": false}, {"start": "11:33", "end": "11:34", "start_seconds": 693.51, "end_seconds": 694.51, "text": "石門水庫", "source": "whisper", "verified": false}, {"start": "11:34", "end": "11:35", "start_seconds": 694.51, "end_seconds": 695.51, "text": "移民新村台樓", "source": "whisper", "verified": false}, {"start": "11:35", "end": "11:37", "start_seconds": 695.51,
