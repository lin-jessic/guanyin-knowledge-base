<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>觀音地方知識｜資料來源</title><style>
*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f8f7fb;color:#302f43;margin:0}.wrap{max-width:1150px;margin:auto;padding:48px 24px}header small{letter-spacing:2px;color:#7b738f}h1{font-size:34px;margin:12px 0}p{color:#666279;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}.stat{padding:22px;background:white;border-radius:15px;border:1px solid #e6e2ed}.stat strong{display:block;font-size:30px}.stat span{color:#797489}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}input,select{border:1px solid #dcd7e7;background:white;border-radius:10px;padding:12px;min-width:170px}input{flex:1}table{border-collapse:collapse;width:100%;background:white}th,td{padding:13px;text-align:left;border-bottom:1px solid #efecf2;font-size:13px;vertical-align:top}th{background:#efecf6}a{color:#5d5282;word-break:break-all}.table{overflow:auto;border-radius:14px;border:1px solid #e6e2ed}td small{color:#7b7687}footer{padding:24px 0;font-size:12px;color:#817c8d}
</style></head><body><div class="wrap"><header><small>GUANYIN LOCAL KNOWLEDGE BASE</small><h1>觀音地方知識｜來源管理</h1><p>以桃園市觀音區為核心的地方來源目錄、爬取進度與來源追溯。官方網域不代表個別事實已交叉查核；HTTP 成功不代表正文清理完成。</p></header><section id="stats" class="stats"></section><div class="filters"><input id="search" placeholder="搜尋 ID、來源、主題或網址"><select id="origin"><option value="">全部來源</option><option value="teacher">老師指定</option><option value="extra">額外官方候選</option></select><select id="status"><option value="">全部狀態</option><option value="success">HTTP 成功</option><option value="unavailable">無法存取</option><option value="failed">失敗</option><option value="pending_video">待影片處理</option><option value="not_tested">未測試</option></select><select id="role"><option value="">全部用途</option><option value="content">內容</option><option value="discovery">探索目錄</option></select></div><p id="count"></p><div class="table"><table><thead><tr><th>編號</th><th>資料來源</th><th>主題／發布單位</th><th>範圍／角色</th><th>爬取狀態</th></tr></thead><tbody id="body"></tbody></table></div><footer>本頁為本機靜態成果展示，資料依生成時的 urls.csv 與 crawl_report.csv 建立。新增／修改／刪除 URL 請使用 Python CLI，網站不會自行爬取。</footer></div><script>
const data=/*SOURCE_DATA*/null;
const el=id=>document.getElementById(id);const escape=s=>String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');const statusLabels={success:'HTTP 200／成功',unavailable:'無法存取',failed:'失敗',pending_video:'待影片處理',not_tested:'未測試'};function render(){const q=el('search').value.toLowerCase(),o=el('origin').value,t=el('status').value,r=el('role').value;let filtered=data.filter(x=>[x.id,x.url,x.title_hint,x.topic,x.publisher].join(' ').toLowerCase().includes(q)&&(!o||x.origin===o)&&(!t||x.crawl_status===t)&&(!r||x.source_role===r));el('count').textContent=`目前顯示 ${filtered.length} 筆`;el('body').innerHTML=filtered.map(x=>`<tr><td>${escape(x.id)}</td><td><b>${escape(x.title_hint||x.id)}</b><div><a href="${escape(x.url)}" target="_blank" rel="noopener noreferrer">${escape(x.url)}</a></div></td><td>${escape(x.topic)}<div><small>${escape(x.publisher)}</small></div></td><td>${escape(x.geo_scope)}<div><small>${escape(x.source_role)}</small></div></td><td>${escape(statusLabels[x.crawl_status]||x.crawl_status)}<div><small>${escape(x.reason)}</small></div></td></tr>`).join('')};el('stats').innerHTML=[['來源總數',data.length],['老師指定',data.filter(x=>x.origin==='teacher').length],['額外來源',data.filter(x=>x.origin==='extra').length],['HTTP 成功',data.filter(x=>x.crawl_status==='success').length],['未測試',data.filter(x=>x.crawl_status==='not_tested').length]].map(x=>`<div class="stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('');['search','origin','status','role'].forEach(id=>el(id).addEventListener('input',render));render();
</script></body></html>
